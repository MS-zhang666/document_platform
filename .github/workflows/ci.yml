name: CI


on:

  push:

    branches:
      - main

  pull_request:

    branches:
      - main


permissions:

  contents: read


jobs:

  quality:

    name: Ruff

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v6


      - name: Setup Python
        uses: actions/setup-python@v5

        with:

          python-version: "3.12"

          cache: pip

          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt


      - name: Install
        run: |

          python -m pip install \
            --upgrade pip

          pip install \
            -r requirements-dev.txt


      - name: Ruff lint
        run: |

          ruff check .


      - name: Ruff format check
        run: |

          ruff format --check .


  tests:

    name: Tests

    runs-on: ubuntu-latest


    services:

      postgres:

        image: postgres:17-alpine

        env:

          POSTGRES_USER: docuser

          POSTGRES_PASSWORD: docpass

          POSTGRES_DB: docplatform_test

        ports:

          - 5432:5432

        options: >-
          --health-cmd
          "pg_isready -U docuser -d docplatform_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10


      redis:

        image: redis:8-alpine

        ports:

          - 6379:6379

        options: >-
          --health-cmd
          "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10


    env:

      APP_ENV: test

      DATABASE_URL: >-
        postgresql+asyncpg://docuser:docpass@localhost:5432/docplatform_test

      REDIS_HOST: localhost

      REDIS_PORT: "6379"

      REDIS_DB: "15"

      STORAGE_ROOT: >-
        /tmp/document-platform-data


    steps:

      - name: Checkout
        uses: actions/checkout@v6


      - name: Setup Python
        uses: actions/setup-python@v5

        with:

          python-version: "3.12"

          cache: pip

          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt


      - name: Install
        run: |

          python -m pip install \
            --upgrade pip

          pip install \
            -r requirements-dev.txt


      - name: Run tests
        run: |

          pytest \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml


  docker-build:

    name: Docker Build

    runs-on: ubuntu-latest

    needs:
      - quality
      - tests

    steps:

      - name: Checkout
        uses: actions/checkout@v6


      - name: Build image
        run: |

          docker build \
            -t document-platform:ci \
            .
