services:

  # ==========================================================
  # PostgreSQL
  # ==========================================================

  postgres:

    image: postgres:17-alpine

    environment:

      POSTGRES_USER: docuser

      POSTGRES_PASSWORD: docpass

      POSTGRES_DB: docplatform

    ports:

      - "127.0.0.1:5432:5432"

    volumes:

      - postgres-data:/var/lib/postgresql/data

    healthcheck:

      test:
        [
          "CMD-SHELL",
          "pg_isready -U docuser -d docplatform"
        ]

      interval: 5s

      timeout: 3s

      retries: 10

    networks:

      - backend


  # ==========================================================
  # Redis
  # ==========================================================

  redis:

    image: redis:8-alpine

    ports:

      - "127.0.0.1:6379:6379"

    volumes:

      - redis-data:/data

    healthcheck:

      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]

      interval: 5s

      timeout: 3s

      retries: 10

    networks:

      - backend


  # ==========================================================
  # FastAPI
  # ==========================================================

  api:

    build: .

    environment:

      APP_NAME: Async Document Platform

      APP_ENV: development

      LOG_LEVEL: INFO

      DATABASE_URL: >-
        postgresql+asyncpg://docuser:docpass@postgres:5432/docplatform

      REDIS_HOST: redis

      REDIS_PORT: "6379"

      REDIS_DB: "0"

      STORAGE_ROOT: /data

    ports:

      - "127.0.0.1:8000:8000"

    volumes:

      - app-data:/data

    depends_on:

      postgres:

        condition: service_healthy

      redis:

        condition: service_healthy

    healthcheck:

      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
        ]

      interval: 10s

      timeout: 3s

      retries: 5

    networks:

      - backend


  # ==========================================================
  # Arq Worker
  # ==========================================================

  worker:

    build: .

    command:
      [
        "arq",
        "app.worker.WorkerSettings"
      ]

    environment:

      APP_ENV: development

      LOG_LEVEL: INFO

      DATABASE_URL: >-
        postgresql+asyncpg://docuser:docpass@postgres:5432/docplatform

      REDIS_HOST: redis

      REDIS_PORT: "6379"

      REDIS_DB: "0"

      STORAGE_ROOT: /data

    volumes:

      - app-data:/data

    depends_on:

      postgres:

        condition: service_healthy

      redis:

        condition: service_healthy

    networks:

      - backend


volumes:

  postgres-data:

  redis-data:

  app-data:


networks:

  backend:
