[tool.pytest.ini_options]

testpaths = [
    "tests",
]

pythonpath = [
    ".",
]

asyncio_mode = "auto"

addopts = "-ra"


[tool.ruff]

target-version = "py312"

line-length = 100


[tool.ruff.lint]

select = [
    "E",
    "F",
    "I",
    "B",
]


[tool.coverage.run]

source = [
    "app",
]

branch = true


[tool.coverage.report]

show_missing = true
